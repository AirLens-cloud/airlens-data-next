# gitleaks config — AirLens monorepo
# Layer 1 (local pre-commit) + Layer 2 (CI) 공용
# Docs: https://github.com/gitleaks/gitleaks#configuration

[extend]
# 100+ 기본 룰셋 활용 (AWS / GCP / Stripe / Slack / OpenAI / Anthropic / Supabase / GitHub PAT 등)
useDefault = true

# ──────────────────────────────────────────────────────────────────────
# Allowlist — AirLens 컨텍스트에서 false-positive 가 명백한 패턴/경로 제외
# ──────────────────────────────────────────────────────────────────────
[allowlist]
description = "AirLens project allowlist"

# 1. Placeholder 문자열 ─ .env.example / 문서에서 합법적으로 사용
regexes = [
  '''your[_-]?\w+[_-]?(key|token|secret|id|url|dsn|password)''',
  '''여기에[_]?\w+[_]?입력''',
  '''your-?(anon|service|project)-?(key|id)?''',
  '''placeholder''',
  '''sk-(proj-)?(your|placeholder|example|test|xxx)''',
  '''appl_placeholder''',
  '''goog_placeholder''',
  '''id0000000000''',
  '''여기에_강력한_비밀번호_입력''',
  # Supabase anon key 는 클라이언트에 노출 가능(public) — VITE_SUPABASE_ANON_KEY 만 허용
  '''VITE_SUPABASE_ANON_KEY\s*=\s*eyJ''',
  '''EXPO_PUBLIC_SUPABASE_ANON_KEY\s*=\s*eyJ''',
  # i18n key string literals (UPPERCASE_PREFIX.UPPERCASE_KEY 형식) — 시크릿 아님
  # 일반화 (PR #361, 2026-05-15) — 1-2 namespace level UPPERCASE.UPPERCASE 모두 catch:
  #   GLOSSARY.DEF_PM25 / PRICING.FAQ_A2 / TRANSPARENCY.STAGE_RAW / GLOSSARY.TOOLTIPS.DEF_*
  # 진짜 secret value (=eyJ... / sk-...) 가 namespace 형태로 누출되는 case 는 별도 규칙이 catch.
  # final segment 는 2자 suffix 도 허용 ({1,}) — OBSERVATORY.H1 / CAMERA.H2 / AUTH.OR /
  #   REFS.R1 / PIPE.S1 / DQSS.H2 등 짧은 접미 키 (PR #840). i18n 키 형식이라 secret 아님.
  '''\b(?:[A-Z][A-Z0-9_]{2,}\.){1,2}[A-Z][A-Z0-9_]{1,}\b''',
]

# 2. 경로 ─ placeholder / 캐시 / 외부 데이터 / 위키
paths = [
  '''.*\.env\.example$''',
  '''.*\.env\.sample$''',
  '''.*\.env\.template$''',
  '''secrets/.*\.env\.example$''',
  # i18n 자동 생성물 (false-positive 가능성)
  '''apps/web/scripts/i18n-.*\.mjs$''',
  '''apps/web/public/locales/.*\.json$''',
  # ML 데이터 / 아티팩트 (이진 파일 / parquet / npy)
  '''models/data/.*''',
  '''models/artifacts/.*''',
  '''platform-data/.*''',
  # Obsidian 위키 (gitignored 이지만 안전벨트)
  '''Obsidian-airlens/.*''',
  # 외부 스킬셋 / 벤더 디렉터리
  '''Skills/.*''',
  '''.*/node_modules/.*''',
  '''.*/\.venv/.*''',
  '''.*\.lockb?$''',
  '''package-lock\.json$''',
  # 플랜 / 메모리 / 로그 (gitignored)
  '''memory/.*''',
  '''logs/.*''',
  # Stitch MCP 디자인 참조 (Screen IDs는 내부 식별자, API key 아님)
  '''.*\.stitch-reference/.*''',
  # secrets/ 디렉터리 (gitignored. working tree scan 시 false-positive 회피)
  '''secrets/.*''',
  # secret-content-scan.py reproduce fixture (의도된 fake sk-/JWT 패턴, plan: secrets-bypass-hook-block.md)
  '''scripts/hooks/tests/secret-content-scan-test\.sh$''',
  # auto-ship-guard2-scan.py reproduce fixture (의도된 fake sk-/JWT 패턴, plan: auto-ship-guard2-exempt.md)
  '''scripts/infra/tests/auto-ship-guard2-scan-test\.sh$''',
  # pre-push hook (Layer 6) reproduce fixture — 의도된 fake JWT/sk-, plan: auto-push-and-pre-push-hook.md
  '''scripts/git-hooks/tests/pre-push-test\.sh$''',
  # Edge Fn ingestAuth Deno test fixture — synthetic `test-ingest-key-...` string
  # used to drive verifyIngestKey constant-time compare; not a real secret.
  # web_test/ = 삭제된 audit fixture sandbox 트윈 (history-only) — full-history 스캔 클린화.
  '''apps/web(_test)?/supabase/functions/_shared/ingestAuth\.test\.ts$''',
]

# 3. Commits ─ 과거 알려진 false-positive (필요 시 추가)
commits = []

# ──────────────────────────────────────────────────────────────────────
# Custom rules — AirLens 도메인 특화 (현재 비어 있음, 필요 시 추가)
# ──────────────────────────────────────────────────────────────────────
# 예시: Polar API 토큰 패턴 (실제 패턴 확정 후 활성화)
# [[rules]]
# id = "airlens-polar-token"
# description = "Polar API token"
# regex = '''polar_(at|pat|live)_[a-zA-Z0-9_-]{32,}'''
# tags = ["polar", "payment"]

# NVIDIA NIM API key — 빌트인 룰셋이 `nvapi-` 포맷을 놓침 (2026-06 near-miss).
[[rules]]
id = "nvidia-nim-api-key"
description = "NVIDIA NIM API key"
regex = '''nvapi-[A-Za-z0-9_-]{20,}'''
keywords = ["nvapi-"]
tags = ["nvidia", "ai", "api"]
