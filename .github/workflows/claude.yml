name: Claude (@claude mention)

# 이슈·PR 코멘트에 @claude 를 쓰면 Claude Code 가 응답한다 (anthropics/claude-code-action).
# - 트리거: 이슈·PR 작성자와 코멘트 작성자가 모두 OWNER·MEMBER·COLLABORATOR 일 때만 job 이
#   뜬다 (author_association). 액션도 쓰기 권한을 다시 확인하고 bot 을 거부한다.
# - fork PR 은 거부한다. 리뷰 이벤트는 if 의 같은-레포 조건으로, issue_comment 는 첫 단계에서
#   막는다. issue_comment 는 fork PR 에서도 base 레포 secret 으로 돌고, 액션이 fork 의 head 를
#   체크아웃하기 때문이다.
# - 커밋은 API 로만 한다 (use_commit_signing — git push 도구를 주지 않는다). PR 에서는 그 PR 의
#   브랜치, 이슈에서는 새 claude/ 브랜치에 커밋한다.
# - 앱 토큰은 contents·pull_requests·issues write 와 actions read 로 좁혀 받는다
#   (additional_permissions). 비워 두면 설치 권한 전체(workflows·repository_hooks write 포함)가 온다.
# - 공개 레포라 Claude 에게 넘기는 코멘트는 목록의 멤버·claude[bot]·요청자(github.actor) 것만
#   넣는다 (include_comments_by_actor). 멤버가 늘면 목록에 추가한다.
# - 과금: secret CLAUDE_CODE_OAUTH_TOKEN(`claude setup-token` 으로 발급한 구독 토큰)이 그 계정의
#   구독 한도를 쓴다. API 키 프로모션 크레딧은 이 액션 요청에 적용되지 않는다(400 "Credit
#   balance is too low", 2026-10-10 확인). 토큰이 새면 claude.ai 에서 폐기하고 secret 을 바꾼다.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.comment.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)) ||
      (github.event_name == 'pull_request_review' && github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.review.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association) &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)) ||
      (github.event_name == 'issues' &&
       (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 같은 이슈·PR 의 요청은 차례로 돈다 (같은 브랜치 경합·중복 과금 방지). 대기는 1건만 남고,
    # 그 사이 새 요청이 오면 대기 중이던 요청은 취소된다.
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read  # PR 의 CI 결과 읽기 (github_ci 도구가 워크플로 토큰으로 읽는다)
    steps:
      - name: Refuse fork PRs
        if: github.event_name == 'issue_comment' && github.event.issue.pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
        run: |
          head="$(gh api "repos/$REPO/pulls/$PR" --jq '.head.repo.full_name // ""')"
          if [ "$head" != "$REPO" ]; then
            echo "::error::@claude is disabled on fork PRs (head: ${head:-unknown})"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@46a42b43239748e5b25771606bf1f551c3b1b517  # v1.0.232
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_commit_signing: true
          additional_permissions: |
            actions: read
          include_comments_by_actor: "joymin5655,claude[bot],${{ github.actor }}"
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 20
